name: Refresh MOEX and publish Pages
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'Команда автономной виртуальной торговли'
        type: choice
        options: [run, pause, resume]
        default: run
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
concurrency:
  group: paperbot-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify application
        run: node --test tests/*.test.cjs
      - name: Collect MOEX snapshot
        run: node scripts/collect.cjs
      - name: Collect dividend history
        run: node scripts/dividends.cjs
      - name: Collect MCFTR for recovery signals
        continue-on-error: true
        run: node scripts/index-recovery.cjs
      - name: Advance virtual portfolios
        id: paper
        continue-on-error: true
        env:
          PAPER_COMMAND: ${{ inputs.command || 'run' }}
        run: node scripts/paper.cjs
      - name: Advance separate dip portfolios
        env:
          PAPER_COMMAND: ${{ inputs.command || 'run' }}
        run: node scripts/slot-dips.cjs
      - name: Save snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dip-books.json data/latest.json data/dividends.json data/paper-state.json data/shadow-state.json data/archive/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh quotes, dividends and virtual portfolios [skip ci]'
            git push
          fi
      - name: Build GitHub Pages from main
        uses: actions/github-script@v7
        with:
          script: |
            const expected = require('child_process').execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
            await github.request('POST /repos/{owner}/{repo}/pages/builds', context.repo);
            for (let attempt = 0; attempt < 60; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const build = await github.request('GET /repos/{owner}/{repo}/pages/builds/latest', context.repo);
              core.info('Pages: ' + build.data.status);
              if (build.data.status === 'built' && build.data.commit === expected) return;
              if (build.data.status === 'errored') throw new Error(build.data.error?.message || 'Pages build failed');
            }
            throw new Error('Pages build timed out');
      - name: Report blocked virtual trading
        if: steps.paper.outcome == 'failure'
        run: |
          echo 'Virtual trading blocked. See data/paper-state.json health. Public state has been updated.'
          exit 1
